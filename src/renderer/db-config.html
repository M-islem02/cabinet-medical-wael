<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuration PostgreSQL - MedCareSO</title>
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/design-tokens.css">
  <link rel="stylesheet" href="./css/components.css">
  <style>
    body {
      margin: 0;
      background: var(--color-bg-subtle);
      color: var(--color-text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .db-page {
      max-width: 880px;
      margin: 0 auto;
      padding: 32px 20px;
    }

    .db-header {
      margin-bottom: 24px;
    }

    .db-header h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
    }

    .db-grid {
      display: grid;
      gap: 16px;
    }

    .db-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .db-field {
      display: grid;
      gap: 6px;
    }

    .db-field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--color-text-muted);
    }

    .db-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 18px;
    }

    .db-status {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      background: var(--color-bg);
      white-space: pre-line;
    }

    @media (max-width: 720px) {
      .db-form-grid {
        grid-template-columns: 1fr;
      }
      .db-actions {
        justify-content: stretch;
      }
      .db-actions button {
        flex: 1;
      }
    }
  </style>
</head>
<body>
  <main class="db-page">
    <header class="db-header">
      <h1>Configuration PostgreSQL</h1>
      <p class="text-muted">Moteur unique: PostgreSQL. Le mode local utilise le serveur embarque; le mode reseau pointe vers le poste serveur du cabinet.</p>
    </header>

    <section class="card-simple db-grid">
      <div class="stat-bar" id="current-status">
        <span>Moteur: <strong>PostgreSQL</strong></span>
        <span>Statut: <strong>Chargement...</strong></span>
      </div>

      <form id="db-form">
        <div class="db-form-grid">
          <div class="db-field">
            <label for="mode">Mode</label>
            <select id="mode" class="form-control">
              <option value="local">Local</option>
              <option value="network">Reseau</option>
            </select>
          </div>
          <div class="db-field">
            <label for="host">Hote</label>
            <input id="host" class="form-control" type="text" value="localhost">
          </div>
          <div class="db-field">
            <label for="port">Port</label>
            <input id="port" class="form-control" type="number" value="5432">
          </div>
          <div class="db-field">
            <label for="database">Base</label>
            <input id="database" class="form-control" type="text" value="cabinet_db">
          </div>
          <div class="db-field">
            <label for="user">Utilisateur</label>
            <input id="user" class="form-control" type="text" value="cabinet_app">
          </div>
          <div class="db-field">
            <label for="password">Mot de passe</label>
            <input id="password" class="form-control" type="password" value="">
          </div>
        </div>

        <div id="message" class="db-status" hidden></div>

        <div class="db-actions">
          <button type="button" class="btn-secondary" id="cancel-btn">Fermer</button>
          <button type="button" class="btn-secondary" id="test-btn">Tester</button>
          <button type="submit" class="btn-primary">Sauvegarder</button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    function readConfig() {
      return {
        database: {
          mode: $('mode').value === 'network' ? 'network' : 'local',
          host: $('host').value.trim() || 'localhost',
          port: Number($('port').value) || 5432,
          database: $('database').value.trim() || 'cabinet_db',
          user: $('user').value.trim() || 'cabinet_app',
          password: $('password').value
        }
      };
    }

    function showMessage(text) {
      $('message').hidden = false;
      $('message').textContent = text;
    }

    async function loadConfig() {
      const config = await window.api.dbConfig.get();
      const db = config.database || {};
      $('mode').value = db.mode === 'network' ? 'network' : 'local';
      $('host').value = db.host || 'localhost';
      $('port').value = db.port || 5432;
      $('database').value = db.database || 'cabinet_db';
      $('user').value = db.user || 'cabinet_app';
      $('password').value = db.password || '';

      const status = await window.api.dbConfig.getStatus();
      const data = status.data || {};
      $('current-status').innerHTML = `
        <span>Moteur: <strong>${data.engine || 'PostgreSQL'}</strong></span>
        <span>Mode: <strong>${data.mode === 'network' ? 'Reseau' : 'Local'}</strong></span>
        <span>Serveur: <strong>${data.host || 'localhost'}:${data.port || 5432}</strong></span>
        <span>Statut: <strong>${data.connected ? 'Connecte' : 'Deconnecte'}</strong></span>
      `;
    }

    $('test-btn').addEventListener('click', async () => {
      showMessage('Test de connexion en cours...');
      const result = await window.api.dbConfig.testConnection(readConfig());
      showMessage(result.success ? 'Connexion PostgreSQL reussie.' : `Connexion impossible: ${result.error || result.message}`);
    });

    $('cancel-btn').addEventListener('click', () => {
      window.api.dbConfig.cancel();
    });

    $('db-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      showMessage('Sauvegarde en cours...');
      const result = await window.api.dbConfig.save(readConfig());
      if (!result.success) {
        showMessage(`Erreur: ${result.error}`);
        return;
      }
      showMessage('Configuration sauvegardee. Redemarrage de l application...');
      setTimeout(() => window.api.dbConfig.restart(), 1200);
    });

    loadConfig().catch((error) => showMessage(`Erreur: ${error.message}`));
  </script>
</body>
</html>
